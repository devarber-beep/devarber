<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music tools · devarber</title>
    <meta name="description" content="Tools de música en el navegador: BPM, tono, metrónomo, delay, Camelot.">
    <link rel="icon" type="image/png" href="/assets/img/favicon.png?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
    <canvas id="skyCanvas"></canvas>
    <div id="cursorHalo" class="cursor-halo" aria-hidden="true"></div>
    <div class="sky-moon" id="skyMoon" role="button" tabindex="0" title="Doble clic" aria-label="Luna — doble clic"></div>
    <div id="scroll-progress"></div>
    <button id="back-to-top" aria-label="Volver arriba">↑</button>
    <div id="toast"></div>
    <button class="egg-btn" id="eggBtn" type="button">
        <span class="egg-icon">🌙</span>
        <span class="egg-text">× Cerrar <kbd>esc</kbd></span>
    </button>

    <nav class="navbar">
        <a href="/" class="nav-logo">
            <img src="/assets/img/avatar.png" alt="" width="32" height="32">
            devarber
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/#about" data-i18n="nav_about">Sobre mí</a>
            <a href="/#projects" data-i18n="nav_projects">Proyectos</a>
            <a href="/#experience" data-i18n="nav_exp">Recorrido</a>
            <a href="/#firma" data-i18n="nav_firma">Destrezas</a>
            <a href="/#stack" data-i18n="nav_stack">Stack</a>
            <a href="/#contact" data-i18n="nav_contact">Contacto</a>
            <span class="nav-sep">|</span>
            <a href="/pages/now/" data-i18n="nav_now">Now</a>
            <a href="/pages/tools/" class="active" data-i18n="nav_tools">Music tools</a>
        </div>
        <div class="nav-right">
            <button class="theme-btn" id="themeToggle" aria-label="Tema">☀</button>
            <button class="lang-btn active" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="nav-toggle" id="navToggle" aria-label="Menú">☰</button>
        </div>
    </nav>

    <section class="section tools-hero">
        <h1 class="section-title" style="margin-bottom:0.5rem"><span data-i18n="tools_title">Music tools</span></h1>
        <p class="hero-desc" style="margin:0;animation:none;opacity:1;text-align:left" data-i18n="tools_sub"></p>
        <p style="color:var(--faint);font-size:0.8rem;font-family:var(--font-mono);margin:0.6rem 0 1.6rem" data-i18n="tools_count">8 herramientas</p>

        <div class="tools-grid" id="toolsCatalog">
            <a class="tool-card" href="#bpm" data-open-tool="bpm"><h3 data-i18n="tool_bpm"></h3><p data-i18n="tool_bpm_d"></p></a>
            <a class="tool-card" href="#key" data-open-tool="key"><h3 data-i18n="tool_key"></h3><p data-i18n="tool_key_d"></p></a>
            <a class="tool-card" href="#metro" data-open-tool="metro"><h3 data-i18n="tool_metro"></h3><p data-i18n="tool_metro_d"></p></a>
            <a class="tool-card" href="#delay" data-open-tool="delay"><h3 data-i18n="tool_delay"></h3><p data-i18n="tool_delay_d"></p></a>
            <a class="tool-card" href="#transpose" data-open-tool="transpose"><h3 data-i18n="tool_transpose"></h3><p data-i18n="tool_transpose_d"></p></a>
            <a class="tool-card" href="#camelot" data-open-tool="camelot"><h3 data-i18n="tool_camelot"></h3><p data-i18n="tool_camelot_d"></p></a>
            <a class="tool-card" href="#chord" data-open-tool="chord"><h3 data-i18n="tool_chord"></h3><p data-i18n="tool_chord_d"></p></a>
            <a class="tool-card" href="#scale" data-open-tool="scale"><h3 data-i18n="tool_scale"></h3><p data-i18n="tool_scale_d"></p></a>
        </div>

        <div id="toolPanels">
            <div class="tool-panel card" data-tool="bpm" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_bpm"></h2>
                <div class="tool-ui">
                    <div class="bpm-read" aria-live="polite">
                        <span class="bpm-num" id="bpmNum">—</span>
                        <span class="bpm-unit">BPM</span>
                    </div>
                    <button type="button" class="bpm-pad" id="bpmTap">tap</button>
                    <p class="tool-readout" id="bpmOut">Pulsa al ritmo.</p>
                    <div class="row"><button type="button" class="btn btn-secondary" id="bpmReset">Reset</button></div>
                </div>
            </div>

            <div class="tool-panel card" data-tool="key" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_key"></h2>
                <div class="tool-ui">
                    <label>Audio (mp3, wav, m4a…)</label>
                    <input type="file" id="keyFile" accept="audio/*">
                    <div class="key-result" id="keyResult" hidden>
                        <p class="key-name" id="keyName"></p>
                        <span class="cam-badge" id="keyCam"></span>
                    </div>
                    <div class="piano" id="keyPiano" hidden></div>
                    <p class="tool-readout" id="keyOut">Elige un archivo. No sale de tu navegador.</p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="metro" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_metro"></h2>
                <div class="tool-ui">
                    <label>BPM</label>
                    <input id="metroBpm" type="number" min="40" max="240" value="120">
                    <div class="metro-beats" id="metroBeats" aria-hidden="true">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="row">
                        <button type="button" class="btn btn-primary" id="metroToggle">Play</button>
                    </div>
                    <p class="tool-readout" id="metroOut">120 BPM · parado</p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="delay" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_delay"></h2>
                <div class="tool-ui">
                    <label>BPM</label>
                    <input id="delayBpm" type="number" min="40" max="240" value="128">
                    <div class="delay-bars" id="delayBars"></div>
                    <p class="tool-readout" id="delayOut"></p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="transpose" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_transpose"></h2>
                <div class="tool-ui">
                    <label>Nota</label>
                    <select id="trNote"></select>
                    <label>Semitonos</label>
                    <input id="trSemi" type="number" min="-12" max="12" value="0">
                    <div class="piano" id="trPiano"></div>
                    <div class="note-row" id="trNotes"></div>
                    <p class="tool-readout" id="trOut"></p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="camelot" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_camelot"></h2>
                <div class="tool-ui">
                    <label>Tonalidad</label>
                    <select id="camKey"></select>
                    <div class="cam-legend">
                        <span class="cam-leg is-now">ahora</span>
                        <span class="cam-leg is-mix">mezcla</span>
                    </div>
                    <div class="cam-wrap" id="camWheel"></div>
                    <div class="note-row" id="camChips"></div>
                    <p class="tool-readout" id="camOut"></p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="chord" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_chord"></h2>
                <div class="tool-ui">
                    <label>Raíz</label>
                    <select id="chRoot"></select>
                    <label>Tipo</label>
                    <select id="chType">
                        <option value="maj">Major</option>
                        <option value="min">Minor</option>
                        <option value="7">7</option>
                        <option value="maj7">maj7</option>
                        <option value="min7">min7</option>
                        <option value="dim">dim</option>
                        <option value="sus4">sus4</option>
                    </select>
                    <div class="piano" id="chPiano"></div>
                    <div class="note-row" id="chNotes"></div>
                    <p class="tool-readout" id="chOut"></p>
                </div>
            </div>

            <div class="tool-panel card" data-tool="scale" style="padding:1.4rem">
                <button type="button" class="tool-back" data-i18n="tool_back"></button>
                <h2 data-i18n="tool_scale"></h2>
                <div class="tool-ui">
                    <label>Raíz</label>
                    <select id="scRoot"></select>
                    <label>Escala</label>
                    <select id="scType">
                        <option value="maj">Mayor</option>
                        <option value="min">Menor natural</option>
                        <option value="dor">Dórica</option>
                        <option value="pen">Pentatónica menor</option>
                    </select>
                    <div class="piano" id="scPiano"></div>
                    <div class="note-row" id="scNotes"></div>
                    <p class="tool-readout" id="scOut"></p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer"><p data-i18n="footer_built">Spain · 2026 · devarber</p></footer>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/sky.js"></script>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/tools.js"></script>
</body>
</html>
